[project]
name = "chicchat"
version = "0.2.0"
description = "WhatsApp support intake for fashion retailers (Python port)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "jinja2>=3.1.4,<3.2",
    "python-multipart>=0.0.17,<0.1",
    "psycopg[binary]>=3.2.3,<3.3",
    "psycopg-pool>=3.2.4,<3.3",
    "httpx>=0.27.2,<0.28",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<1.14",
    "import-linter>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chicchat"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, naming, pyupgrade, simplify, no print,
# no empty except (BLE/S110 equivalents via bugbear + TRY).
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "T20", "RUF", "PLE"]
# RUF001-003: Turkish letters (ı, İ, ş) and typographic dashes are deliberate.
# PLE1205: our JSON logger is not the stdlib `logging` module it pattern-matches.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PLE1205"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
"chicchat/scripts/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["chicchat", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DB tests need a live PostgreSQL; run them with `pytest -m db`.
markers = ["db: needs a local *_test PostgreSQL database (DATABASE_URL)"]
addopts = "-m 'not db' -q"

[tool.importlinter]
root_package = "chicchat"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure (Handbook §2)"
type = "forbidden"
source_modules = ["chicchat.domain"]
forbidden_modules = [
    "chicchat.db",
    "chicchat.server",
    "chicchat.web",
    "fastapi",
    "starlette",
    "psycopg",
    "psycopg_pool",
    "httpx",
    "jinja2",
    "os",
]

[[tool.importlinter.contracts]]
name = "Layers: web -> server -> db -> domain"
type = "layers"
layers = ["chicchat.web", "chicchat.server", "chicchat.db", "chicchat.domain"]
