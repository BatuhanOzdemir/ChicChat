{% extends "base.html" %}
{# Named-account sign-in. Only opaque, server-validated session tokens reach cookies. #}
{% block body %}
<main class="mx-auto flex min-h-screen max-w-sm flex-col justify-center p-6 text-zinc-900 dark:text-zinc-100">
  <h1 class="text-2xl font-semibold">ChicChat</h1>
  <p class="mt-1 text-sm text-zinc-500">Sign in to access your merchant conversations.</p>
  {% if failed %}
  <p class="mt-4 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800 dark:border-red-800 dark:bg-red-950 dark:text-red-200">
    Sign-in failed. Check your credentials or try again later.
  </p>
  {% endif %}
  <form method="post" action="/login" class="mt-4 flex flex-col gap-3">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="flex flex-col gap-1 text-xs text-zinc-500">
      Username
      <input name="username" autocomplete="username" required class="rounded border px-3 py-2">
    </label>
    <label class="flex flex-col gap-1 text-xs text-zinc-500">
      Password
      <input class="rounded border border-zinc-300 px-3 py-2 text-sm dark:border-zinc-700 dark:bg-zinc-900"
             type="password" name="passcode" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit"
            class="rounded bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-700 dark:bg-zinc-100 dark:text-zinc-900">
      Enter
    </button>
  </form>
</main>
{% endblock %}
