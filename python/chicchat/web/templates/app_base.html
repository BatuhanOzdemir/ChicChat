{% extends "base.html" %}
{# Chrome shared by every operator surface: the section bar (port of nav.tsx). #}
{% block body %}
<nav aria-label="Sections" class="sticky top-0 z-20 border-b border-zinc-200 bg-white/90 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-1 gap-y-2 px-6 py-2">
    <a href="/" class="mr-3 text-sm font-semibold tracking-tight text-zinc-900 hover:opacity-70 dark:text-zinc-100">ChicChat</a>
    {% for section in nav_sections %}
    {% set current = section.href == nav_active %}
    <a href="{{ section.href }}" title="{{ section.hint }}" {% if current %}aria-current="page"{% endif %}
       class="{{ 'rounded-full bg-zinc-900 px-3 py-1 text-sm font-medium text-white dark:bg-zinc-100 dark:text-zinc-900' if current else 'rounded-full px-3 py-1 text-sm text-zinc-600 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800' }}">{{ section.label }}</a>
    {% endfor %}
    <form method="post" action="/logout" class="ms-auto">
      <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
      <button class="text-sm underline">Sign out</button>
    </form>
  </div>
</nav>
<div class="flex-1">{% block content %}{% endblock %}</div>
{% endblock %}
